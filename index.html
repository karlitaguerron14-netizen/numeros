
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numeros primos</title>
</head>
<body>
    <div>
        <header>
            <h1>Numeros primos</h1>
        </header>
    </div>

    <div>
        <form action="" id="formNumeros">
            <div>
                <label for="num1">Ingrese el primer numero </label>
                <input type="number" id="num1" required>
            </div>

            <div>
                <label for="num2">Ingrese el segundo numero</label>
                <input type="number" id="num2" required>
            </div>

            <div>
                <input type="submit" value="Verificar numeros">
            </div>
        </form>

        <div>
            <h3>Resultados de la verificacion</h3>
            <div id="resultado"></div>
        </div>
    </div>

    <script src="javascript.js"></script>
</body>
</html>
